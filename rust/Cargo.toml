[package]
name = "realesrgan-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A cross-platform GUI for Real-ESRGAN-ncnn-vulkan"
license = "MIT"
build = "build.rs"

[[bin]]
name = "realesrgan-gui"
path = "src/main.rs"

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "links",
    "clipboard",
    "system_fonts",
    "x11",
    "wayland",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "tiff",
    "bmp",
] }
webp = { version = "0.3", default-features = false }
gif = { version = "0.14", features = ["color_quant"] }
rfd = "0.17"
sys-locale = "0.3"
shlex = "2"
tempfile = "3"
open = "5"
dark-light = "3"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }
notify-rust = { version = "4", default-features = false }

# On Linux/BSD the D-Bus backend is required for notifications.
[target.'cfg(not(windows))'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"